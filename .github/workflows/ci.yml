name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      full_build:
        description: Also build, smoke-test and package all five platforms
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build for a release
        required: true
        type: string

permissions:
  contents: read

# Keep PR/push checks independent. Reusable release builds use their exact SHA
# and must not be cancelled: publication consumes artifacts from that same run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

jobs:
  # Fast feedback for pushes and PRs. Inside a workflow_call, github.event_name
  # is the caller's event, so a release build is recognized by inputs.ref.
  checks:
    name: Checks (${{ matrix.runner }})
    if: ${{ !inputs.ref }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    env:
      PYTHONUTF8: '1'
      POETRY_NO_INTERACTION: '1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install poetry==2.5.1
          poetry install --with dev
      - name: Verify version and bundled engines
        run: |
          poetry run python -m scripts.release version
          poetry run python -m scripts.release verify-engines
      - name: Run tests
        run: |
          node --check scripts/publish_release.cjs
          poetry run python -m compileall -q complex_unzip_tool_v2 scripts
          poetry run pytest -q

  # Full native builds: for releases, or on demand (workflow_dispatch full_build).
  build:
    name: Build (${{ matrix.target }})
    if: ${{ inputs.ref || inputs.full_build }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            architecture: x64
            executable: dist/complex-unzip-tool-v2.exe
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
            executable: dist/complex-unzip-tool-v2
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
            executable: dist/complex-unzip-tool-v2
          - target: linux-x64
            runner: ubuntu-24.04
            architecture: x64
            executable: dist/complex-unzip-tool-v2
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
            executable: dist/complex-unzip-tool-v2
    env:
      PYTHONUTF8: '1'
      POETRY_NO_INTERACTION: '1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
      - name: Install locked dependencies
        run: |
          python -m pip install poetry==2.5.1
          poetry install --with dev
      - name: Verify version and bundled engines
        run: |
          poetry run python -m scripts.release version
          poetry run python -m scripts.release verify-engines
      - name: Run tests
        run: |
          node --check scripts/publish_release.cjs
          poetry run python -m compileall -q complex_unzip_tool_v2 scripts
          poetry run pytest -q
      - name: Smoke test source CLI
        run: poetry run python -m scripts.smoke_test
      - name: Build standalone executable
        run: poetry run build
      - name: Smoke test standalone executable
        env:
          EXECUTABLE: ${{ matrix.executable }}
        shell: bash
        run: poetry run python -m scripts.smoke_test --executable "$EXECUTABLE"
      - name: Package executable and notices
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: poetry run python -m scripts.release package "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
