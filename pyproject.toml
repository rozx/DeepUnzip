[tool.poetry]
name = "complex-unzip-tool-v2"
version = "1.3.2"
description = "A powerful tool for extracting complex archive files with password support and multipart handling"
authors = ["Rozx <lisida900710@gmail.com>"]
readme = "README.md"
packages = [{include = "deepunzip"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
typer = "^0.17.3"
rich = "^14.1.0"
send2trash = "^1.8.3"
bump2version = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
pyinstaller = "^6.15.0"

[tool.poetry.scripts]
main = "deepunzip.main:app"
cuz = "deepunzip.main:app"
build = "scripts.build:main"
bump = "scripts.version:bump_version"
bump-patch = "scripts.version:bump_patch"
bump-minor = "scripts.version:bump_minor"
bump-major = "scripts.version:bump_major"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
